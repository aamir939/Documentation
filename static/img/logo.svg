<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#gradient1)"/>

  <!-- Inner GPU-like pattern -->
  <rect x="50" y="60" width="100" height="80" rx="8" fill="#1e293b"/>

  <!-- GPU cores representation -->
  <g fill="#60a5fa">
    <rect x="60" y="70" width="16" height="16" rx="2"/>
    <rect x="82" y="70" width="16" height="16" rx="2"/>
    <rect x="104" y="70" width="16" height="16" rx="2"/>
    <rect x="126" y="70" width="16" height="16" rx="2"/>

    <rect x="60" y="92" width="16" height="16" rx="2"/>
    <rect x="82" y="92" width="16" height="16" rx="2"/>
    <rect x="104" y="92" width="16" height="16" rx="2"/>
    <rect x="126" y="92" width="16" height="16" rx="2"/>

    <rect x="60" y="114" width="16" height="16" rx="2"/>
    <rect x="82" y="114" width="16" height="16" rx="2"/>
    <rect x="104" y="114" width="16" height="16" rx="2"/>
    <rect x="126" y="114" width="16" height="16" rx="2"/>
  </g>

  <!-- Connection lines (InfiniBand representation) -->
  <g stroke="#22d3ee" stroke-width="2">
    <line x1="50" y1="100" x2="30" y2="100"/>
    <line x1="150" y1="100" x2="170" y2="100"/>
    <line x1="100" y1="60" x2="100" y2="40"/>
    <line x1="100" y1="140" x2="100" y2="160"/>
  </g>

  <!-- Connection dots -->
  <g fill="#22d3ee">
    <circle cx="30" cy="100" r="4"/>
    <circle cx="170" cy="100" r="4"/>
    <circle cx="100" cy="40" r="4"/>
    <circle cx="100" cy="160" r="4"/>
  </g>

  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
  </defs>
</svg>
